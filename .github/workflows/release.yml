name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gui: kodikdown-linux-x86_64
            cli: kodikdown-linux-x86_64-cli
          - os: windows-latest
            gui: kodikdown-windows-x86_64.exe
            cli: kodikdown-windows-x86_64-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Build the desktop app
        env:
          KODIKDOWN_BUILD_NAME: ${{ matrix.gui }}
        run: pyinstaller packaging/kodikdown.spec --noconfirm
      - name: Build the command-line tool
        env:
          KODIKDOWN_BUILD_NAME: ${{ matrix.cli }}
        run: pyinstaller packaging/kodikdown-cli.spec --noconfirm
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui }}
          path: |
            dist/${{ matrix.gui }}
            dist/${{ matrix.cli }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Take the notes for this tag from the changelog
        run: |
          python - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", changelog, re.M | re.S
          )
          body = section.group(0).strip() if section else f"KodikDown {version}."
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          print(body.splitlines()[0])
          PY
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: release-notes.md
