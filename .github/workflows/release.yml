name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            gui: kodikdown-linux-x86_64
            cli: kodikdown-linux-x86_64-cli
          - os: windows-latest
            gui: kodikdown-windows-x86_64.exe
            cli: kodikdown-windows-x86_64-cli.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Build the desktop app
        run: pyinstaller packaging/kodikdown.spec --noconfirm --name "${{ matrix.gui }}"
      - name: Build the command-line tool
        run: pyinstaller packaging/kodikdown-cli.spec --noconfirm --name "${{ matrix.cli }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.gui }}
          path: |
            dist/${{ matrix.gui }}
            dist/${{ matrix.cli }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
