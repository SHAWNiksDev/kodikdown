name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.ref_name }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - name: Build the desktop app
        env:
          KODIKDOWN_BUILD_NAME: kodikdown-linux-x86_64
        run: pyinstaller packaging/kodikdown.spec --noconfirm
      - name: Build the command-line tool
        env:
          KODIKDOWN_BUILD_NAME: kodikdown-linux-x86_64-cli
        run: pyinstaller packaging/kodikdown-cli.spec --noconfirm
      - run: dist/kodikdown-linux-x86_64-cli --version
      - uses: actions/upload-artifact@v4
        with:
          name: kodikdown-linux
          path: |
            dist/kodikdown-linux-x86_64
            dist/kodikdown-linux-x86_64-cli

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      # Release signing stays local. CI verifies the published APK without
      # receiving a private key or a signing password.
      - name: Verify the signed Android release
        id: apk
        run: |
          python3 - <<'PY'
          import os
          import re
          import subprocess
          from pathlib import Path

          tools = Path(os.environ["ANDROID_HOME"]) / "build-tools" / "35.0.0"
          apk = Path("packaging/kodikdown-android.apk")
          if not apk.is_file():
              print("::notice::No signed Android APK was supplied for this tag.")
              raise SystemExit(0)
          manifest = subprocess.check_output([str(tools / "aapt"), "dump", "badging", apk], text=True)
          version = re.search(r"versionName='([^']+)'", manifest)
          if version is None:
              raise SystemExit("The APK has no version name.")
          if version.group(1) != os.environ["GITHUB_REF_NAME"].removeprefix("v"):
              print(f"::notice::Android APK {version.group(1)} belongs to an earlier release. Publishing desktop builds.")
              raise SystemExit(0)
          cert = subprocess.check_output(
              [str(tools / "apksigner"), "verify", "--print-certs", apk], text=True
          )
          expected = "68f6befb12d7f54328707615981be9edf60c948bb5b697d883740f73c5637ccc"
          actual = re.search(r"certificate SHA-256 digest: (\w+)", cert)
          if actual is None or actual.group(1) != expected:
              raise SystemExit("The APK is not signed with the release certificate.")
          if "application-debuggable" in manifest:
              raise SystemExit("A debug APK must not be published as the release.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("verified=true\n")
          print("APK signature, version and release flags verified.")
          PY
      - uses: actions/upload-artifact@v4
        if: steps.apk.outputs.verified == 'true'
        with:
          name: kodikdown-android
          path: packaging/kodikdown-android.apk

  release:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Take the notes for this tag from the changelog
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", changelog, re.M | re.S
          )
          body = section.group(0).strip() if section else f"KodikDown {version}."
          if not pathlib.Path("dist/kodikdown-android.apk").is_file():
              body += (
                  "\n\nСборки этого выпуска доступны для Windows и Linux. "
                  "Публичный APK Android остаётся в [релизе 4.0.0]"
                  "(https://github.com/SHAWNiksDev/kodikdown/releases/tag/v4.0.0)."
              )
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
      - name: Calculate download checksums
        run: cd dist && sha256sum kodikdown-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: KodikDown ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
