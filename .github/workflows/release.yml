name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  windows:
    uses: ./.github/workflows/windows.yml
    with:
      tag: ${{ github.ref_name }}
      commit: ${{ github.sha }}

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Linux build and GUI test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 xvfb xdotool
      - run: pip install -e '.[dev]'
      - name: Check the release version
        run: python -c 'import os; from kodikdown import __version__; assert os.environ["GITHUB_REF_NAME"] == f"v{__version__}"'
      - name: Build the desktop app
        env:
          KODIKDOWN_BUILD_NAME: kodikdown-linux-x86_64
        run: pyinstaller packaging/kodikdown.spec --noconfirm
      - name: Build the command-line tool
        env:
          KODIKDOWN_BUILD_NAME: kodikdown-linux-x86_64-cli
        run: pyinstaller packaging/kodikdown-cli.spec --noconfirm
      - name: Build the AppImage
        run: bash packaging/build_appimage.sh
      - name: Check the packaged apps
        run: |
          expected="kodikdown ${GITHUB_REF_NAME#v}"
          test "$(dist/kodikdown-linux-x86_64-cli --version)" = "$expected"
          test "$(dist/kodikdown-linux-x86_64 --version)" = "$expected"
          image=dist/kodikdown-linux-x86_64.AppImage
          test "$(APPIMAGE_EXTRACT_AND_RUN=1 "$image" --version)" = "$expected"
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb xvfb-run -a bash -eu -c '
            "$1" &
            app=$!
            trap "kill $app 2>/dev/null || true; wait $app 2>/dev/null || true" EXIT
            for ((attempt = 0; attempt < 60; attempt++)); do
              kill -0 "$app"
              if xdotool search --onlyvisible --name "^KodikDown$" >/dev/null; then
                exit 0
              fi
              sleep 1
            done
            exit 1
          ' test-appimage "$image"
      - uses: actions/upload-artifact@v4
        with:
          name: kodikdown-linux
          if-no-files-found: error
          path: |
            dist/kodikdown-linux-x86_64
            dist/kodikdown-linux-x86_64-cli
            dist/kodikdown-linux-x86_64.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify the signed Android release
        run: python3 packaging/verify_android_release.py
      - uses: actions/upload-artifact@v4
        with:
          name: kodikdown-android
          if-no-files-found: error
          path: packaging/kodikdown-android.apk

  release:
    needs: [linux, android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Take the notes for this tag from the changelog
        run: |
          python3 - <<'PY'
          import os
          import pathlib
          import re

          version = os.environ["GITHUB_REF_NAME"].lstrip("v")
          changelog = pathlib.Path("CHANGELOG.md").read_text(encoding="utf-8")
          section = re.search(
              rf"^## \[{re.escape(version)}\].*?(?=^## \[|\Z)", changelog, re.M | re.S
          )
          required = {
              "kodikdown-android.apk", "kodikdown-linux-x86_64", "kodikdown-linux-x86_64-cli",
              "kodikdown-linux-x86_64.AppImage",
              "kodikdown-windows-x86_64.exe", "kodikdown-windows-x86_64-cli.exe",
          }
          missing = required - {path.name for path in pathlib.Path("dist").iterdir() if path.is_file()}
          if missing:
              raise SystemExit(f"Missing release artifacts: {', '.join(sorted(missing))}")
          body = section.group(0).partition("\n")[2].strip() if section else f"KodikDown {version}."
          pathlib.Path("release-notes.md").write_text(body + "\n", encoding="utf-8")
          PY
      - name: Calculate download checksums
        run: cd dist && sha256sum kodikdown-* > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: KodikDown ${{ github.ref_name }}
          files: dist/*
          body_path: release-notes.md
